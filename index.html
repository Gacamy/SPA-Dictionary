<!DOCTYPE html>
<html lang="en">

<head>
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Wordly</h1>
        <p>Your simple, friendly dictionary</p>
    </header>

    <main>

        <form id="search-form">
            <input type="text" id="word-input" placeholder="Type a word... e.g. happy" required>
            <button type="submit">Search</button>
        </form>

        <button id="theme-btn">Dark Mode</button>

        <p id="error-message" class="hidden"></p>

        <section id="result-card" class="hidden">

            <h2 id="word-title"></h2>

            <p id="part-of-speech"></p>

            <h3>Definition</h3>
            <p id="definition"></p>

            <h3>Example</h3>
            <p id="example"></p>

            <h3>Synonyms</h3>
            <p id="synonyms"></p>

            <button id="save-btn">Save Word</button>

        </section>

        <section id="saved-section">
            <h3>Saved Words</h3>
            <ul id="saved-list">
            </ul>
        </section>

    </main>

    <footer>
        <p>Built for the Wordly SPA Lab</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
